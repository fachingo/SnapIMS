[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snapims"
version = "0.5.1"
description = "Photo-first, exception-driven inventory ingestion for physical media"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Isaiah Newman"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "Pillow>=10.0",
  "opencv-python-headless>=4.9",
  "python-dotenv>=1.0",
  "openai>=1.30",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "playwright>=1.45",
  "ruff>=0.6",
  "mypy>=1.11",
  "python-docx>=1.1",
  "build>=1.2",
  "pytest-cov>=5.0",
]

[project.scripts]
snapims = "snapims.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snapims*"]

[tool.setuptools.package-data]
"snapims.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
