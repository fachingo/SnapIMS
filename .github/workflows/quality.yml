name: quality
on:
  push:
    branches: ["fix/**", "reconstruction/**", "feature/**", "main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check .
      - run: mypy snapims --ignore-missing-imports
      - run: python -m compileall -q snapims
      - run: python -m build
      - run: python -m pip check
      - name: Installed wheel smoke
        run: |
          python -m venv /tmp/snapims-wheel-smoke
          /tmp/snapims-wheel-smoke/bin/pip install dist/snapims-*.whl
          /tmp/snapims-wheel-smoke/bin/snapims --version
          /tmp/snapims-wheel-smoke/bin/python -c "from snapims.web.app import app; assert app.version == '0.5.1'"
